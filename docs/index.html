<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#020508" />
<title>J.A.R.V.I.S. HUD</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Sfondo: feed della fotocamera -->
<video id="camera-feed" autoplay playsinline muted></video>
<canvas id="capture-canvas" hidden></canvas>

<!-- Overlay HUD -->
<div id="hud">

  <!-- Righello decorativo verticale (stile altimetro) -->
  <div id="ruler-left"></div>

  <!-- Alto centro: ora e data -->
  <div class="panel panel-clock" id="panel-clock">
    <div id="clock-time">--:--</div>
    <div id="clock-date">-- --- ----</div>
  </div>

  <!-- Alto sinistra: mappa GPS -->
  <div class="panel panel-map" id="panel-map">
    <div class="panel-label">POSIZIONE</div>
    <div id="map"></div>
    <div class="scan-line"></div>
  </div>

  <!-- Sinistra (sotto mappa): meteo -->
  <div class="panel panel-weather" id="panel-weather">
    <div class="panel-label">AMBIENTE</div>
    <div class="weather-row">
      <span id="weather-temp">--°</span>
      <span id="weather-desc">---</span>
    </div>
    <div class="weather-sub" id="weather-sub">umidita -- % / vento -- km/h</div>
  </div>

  <!-- Basso sinistra: avatar corpo + vitali -->
  <div class="panel panel-vitals" id="panel-vitals">
    <div class="panel-label">STATO FISICO</div>
    <div id="avatar-canvas-wrap"><canvas id="avatar-canvas"></canvas></div>
    <div class="vitals-grid">
      <div class="vital"><span class="vital-label">SONNO</span><span class="vital-value" id="vital-sonno">-- h</span></div>
      <div class="vital"><span class="vital-label">BATTITI</span><span class="vital-value" id="vital-battiti">-- bpm</span></div>
      <div class="vital"><span class="vital-label">ENERGIA</span><span class="vital-value" id="vital-energia">--%</span></div>
      <div class="vital"><span class="vital-label">STATO</span><span class="vital-value" id="vital-stato">-</span></div>
    </div>
    <button id="btn-edit-vitals" class="ghost-btn">AGGIORNA</button>
  </div>

  <!-- Alto destra: mini terminale -->
  <div class="panel panel-terminal" id="panel-terminal">
    <div class="panel-label">J.A.R.V.I.S. // LOG</div>
    <div id="terminal-lines"></div>
  </div>

  <!-- Destra: notifiche -->
  <div class="panel panel-notifications" id="panel-notifications">
    <div class="panel-label">NOTIFICHE</div>
    <div id="notif-list"></div>
  </div>

  <!-- Centro: mirino -->
  <div id="reticle">
    <svg viewBox="0 0 200 200">
      <circle class="ring ring-1" cx="100" cy="100" r="90" />
      <circle class="ring ring-2" cx="100" cy="100" r="70" />
      <circle class="ring ring-3" cx="100" cy="100" r="50" />
      <!-- Tacche radianti minori (stile mirino tecnico) -->
      <line class="tick-minor" x1="100" y1="8" x2="100" y2="14" transform="rotate(30 100 100)" />
      <line class="tick-minor" x1="100" y1="8" x2="100" y2="14" transform="rotate(60 100 100)" />
      <line class="tick-minor" x1="100" y1="8" x2="100" y2="14" transform="rotate(120 100 100)" />
      <line class="tick-minor" x1="100" y1="8" x2="100" y2="14" transform="rotate(150 100 100)" />
      <line class="tick-minor" x1="100" y1="8" x2="100" y2="14" transform="rotate(210 100 100)" />
      <line class="tick-minor" x1="100" y1="8" x2="100" y2="14" transform="rotate(240 100 100)" />
      <line class="tick-minor" x1="100" y1="8" x2="100" y2="14" transform="rotate(300 100 100)" />
      <line class="tick-minor" x1="100" y1="8" x2="100" y2="14" transform="rotate(330 100 100)" />
      <line class="tick" x1="100" y1="4" x2="100" y2="20" />
      <line class="tick" x1="100" y1="196" x2="100" y2="180" />
      <line class="tick" x1="4" y1="100" x2="20" y2="100" />
      <line class="tick" x1="196" y1="100" x2="180" y2="100" />
      <line class="sweep" x1="100" y1="100" x2="100" y2="10" />
    </svg>
    <div id="reticle-target-label"></div>
  </div>

  <!-- Overlay riquadri oggetti (scansione continua) -->
  <div id="overlay-boxes"></div>

  <!-- Pulsante scansione continua -->
  <button id="btn-scan-toggle" title="Scansione continua">SCAN: OFF</button>

  <!-- Indicatore modalita' confronto -->
  <div id="compare-indicator" class="hidden">MODALITA' CONFRONTO: inquadra il primo oggetto e parla</div>

  <!-- Basso centro: pulsante voce + risposta corrente -->
  <div id="response-box"></div>
  <button id="btn-talk">
    <div id="talk-pulse"></div>
    <span id="talk-icon">&#127908;</span>
  </button>

</div>

<!-- Scheda oggetto completa -->
<div id="card-modal" class="modal hidden">
  <div class="modal-box card-box">
    <div class="panel-label" id="card-title">SCHEDA OGGETTO</div>
    <div id="card-image-wrap"><img id="card-image" alt="" /></div>
    <div id="card-body"></div>
    <button id="btn-card-close" class="ghost-btn">CHIUDI</button>
  </div>
</div>

<!-- Overlay di richiesta permessi iniziale -->
<div id="boot-screen">
  <div id="boot-title">J.A.R.V.I.S.</div>
  <div id="boot-sub">Inizializzazione sistema HUD</div>
  <button id="btn-boot-start">AVVIA</button>
  <div id="boot-status"></div>
</div>

<!-- Modale inserimento vitali manuale -->
<div id="vitals-modal" class="modal hidden">
  <div class="modal-box">
    <div class="panel-label">AGGIORNA STATO FISICO</div>
    <label>Ore di sonno <input type="number" id="input-sonno" min="0" max="24" step="0.5" /></label>
    <label>Battiti (bpm) <input type="number" id="input-battiti" min="30" max="220" step="1" /></label>
    <label>Energia (%) <input type="number" id="input-energia" min="0" max="100" step="5" /></label>
    <label>Stato generale
      <select id="input-stato">
        <option value="Ottimo">Ottimo</option>
        <option value="Buono">Buono</option>
        <option value="Stanco">Stanco</option>
        <option value="Affaticato">Affaticato</option>
      </select>
    </label>
    <div class="modal-actions">
      <button id="btn-vitals-save" class="ghost-btn">SALVA</button>
      <button id="btn-vitals-cancel" class="ghost-btn ghost-btn-muted">ANNULLA</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="config.js"></script>
<script src="memory.js"></script>
<script src="app.js"></script>
</body>
</html>
